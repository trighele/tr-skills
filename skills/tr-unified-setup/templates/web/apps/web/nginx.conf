server {
    listen 80;
    root /usr/share/nginx/html;

    # A single-page app: any path that is not a built file is one of the app's own routes, so
    # it gets index.html and React decides. /api never reaches this server; the router sends
    # it to the api component first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
